<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALBERT GRECHUSHKIN</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="hero" aria-label="ALBERT GRECHUSHKIN">
      <div class="hero__media" aria-hidden="true">
        <div class="hero__image hero__image--luxury"></div>
        <div class="hero__image hero__image--reality"></div>
      </div>
      <div class="hero__shade" aria-hidden="true"></div>

      <a class="hero__sister" href="story.html" aria-label="История Альберта от сестры">
        <svg class="hero__sister-heart" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20.2C7.4 16 4 12.8 4 8.9C4 6.7 5.7 5 7.9 5C9.2 5 10.5 5.6 11.3 6.6L12 7.5L12.7 6.6C13.5 5.6 14.8 5 16.1 5C18.3 5 20 6.7 20 8.9C20 12.8 16.6 16 12 20.2Z" />
        </svg>
        <span>SISTER</span>
      </a>

      <section class="hero__content">
        <p class="hero__kicker">ПРЕДПРИНИМАТЕЛЬ &bull; ИНВЕСТОР &bull; ВИЗИОНЕР</p>

        <h1 class="hero__title">
          <span>ALBERT</span>
          <span>GRECHUSHKIN</span>
        </h1>

        <p class="hero__year">1989</p>

        <a class="hero__button" href="#" aria-label="Показать реальность">
          <span>ПОКАЗАТЬ РЕАЛЬНОСТЬ</span>
          <span class="hero__button-arrow" aria-hidden="true">&rarr;</span>
        </a>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
